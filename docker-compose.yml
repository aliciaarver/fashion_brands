services:
  app:
    build:
      context: .
      target: development
    environment:
      DATABASE_URL: postgres://fashion:fashion@db:5432/fashion
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:-change-this-to-a-random-string-of-at-least-32-characters}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - fashion_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fashion
      POSTGRES_USER: fashion
      POSTGRES_PASSWORD: fashion
    ports:
      - "54329:5432"
    volumes:
      - fashion_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashion -d fashion"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  fashion_node_modules:
  fashion_postgres:
